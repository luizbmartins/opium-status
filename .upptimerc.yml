# Config do status.opium.vet
owner: luizbmartins # Your GitHub organization or username, where this repository lives
repo: opium-status # The name of this repository

sites:
  # slug fixado pra bater com o history/*.json ja gravado (plataforma/banco-de-dados
  # eram derivados do "name" antigo em portugues; sem isso, traduzir o name ia
  # criar slugs novos e orfanizar o historico de hoje).
  - name: Platform
    url: https://app.opium.vet/
    slug: plataforma
  - name: API
    url: https://app.opium.vet/api/health
    slug: api
  - name: Database
    url: https://app.opium.vet/api/health/db
    slug: banco-de-dados

status-website:
  # DNS: status.opium.vet aponta (CNAME, via Cloudflare Pages) pro site estatico gerado aqui
  cname: status.opium.vet
  logoUrl: https://raw.githubusercontent.com/luizbmartins/opium-status/master/assets/opium-logo.svg
  name: Opium — Status
  introTitle: "**Opium Status**"
  introMessage: System, API and database availability, monitored every few minutes via GitHub Actions. Static page, independent from our own infrastructure — stays up even if our servers go down.
  navbar:
    - title: Status
      href: /
    - title: Opium
      href: https://app.opium.vet

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
